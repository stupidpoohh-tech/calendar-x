<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
<meta name="description" content="할 일과 아이디어와 돈을 같은 날짜 위에서 관리하는 캘린더." />
<title>Dada Calendar</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

<script>
  // 첫 페인트 전에 테마를 확정해 화면 깜빡임을 없앤다.
  (function () {
    try {
      var raw = localStorage.getItem('dada.pref.v2');
      var theme = raw ? (JSON.parse(raw).theme || 'system') : 'system';
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.dataset.theme = theme;
      }
    } catch (e) { /* 저장소 접근 실패 시 시스템 테마를 따른다 */ }
  })();
</script>
</head>
<body>
  <div id="app"><div class="splash">Dada Calendar</div></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
